services:
  postgres:
    image: postgres:16-alpine
    container_name: palapa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_palapa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5435:5432"
    volumes:
      - pgdata_palapa:/var/lib/postgresql/data

volumes:
  pgdata_palapa:
